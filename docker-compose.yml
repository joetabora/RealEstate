services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: examcoach
      POSTGRES_PASSWORD: examcoach
      POSTGRES_DB: examcoach
    ports:
      - "5433:5432"
    volumes:
      - examcoach_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examcoach -d examcoach"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  examcoach_pgdata:
